<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Animación Senoidal</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #ead5df,
                #d4bac6,
                #c7a7bc
            );

            font-family: 'Gill Sans',
                         'Gill Sans MT',
                         Calibri, sans-serif;

            color: #460c38;
        }


        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px;

            background: rgba(255, 255, 255, 0.90);
            border-radius: 30px;

            box-shadow:
                0 15px 40px rgba(70, 12, 56, 0.20);

            text-align: center;
        }


        h1 {
            margin: 0;
            color: #a70d81;
            font-size: 40px;
            letter-spacing: 2px;
        }

    h2 {
            color: #460c38;
            font-size: 25px;
        }

        .linea {
            width: 70px;
            height: 5px;
            margin: 18px auto 25px;

            background: #a70d81;
            border-radius: 10px;
        }


        p {
            color: #a70d81;
            font-family: 'Franklin Gothic Medium',
                         'Arial Narrow',
                         Arial, sans-serif;
            font-size: 18px;
        }


        .canvas-container {
            width: 100%;
            padding: 12px;

            background: #f7edf3;
            border: 2px solid #d7b4ca;
            border-radius: 20px;

            box-shadow:
                0 10px 25px rgba(70, 12, 56, 0.18);

            overflow: hidden;
        }


        canvas {
            display: block;
            width: 100%;
            height: auto;

            background: white;
            border-radius: 12px;
        }


        .back-button {
            display: inline-block;
            margin-top: 30px;
            padding: 13px 28px;

            background: #a70d81;
            color: white;

            text-decoration: none;
            border-radius: 30px;

            font-size: 16px;
            font-weight: bold;

            transition:
                background 0.3s ease,
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }


        .back-button:hover {
            background: #7d0961;
            transform: translateY(-3px);

            box-shadow:
                0 8px 18px rgba(167, 13, 129, 0.30);
        }

        
        @media (max-width: 700px) {

            body {
                padding: 20px 12px;
            }

            .container {
                padding: 25px 15px;
                border-radius: 20px;
            }

            h1 {
                font-size: 30px;
            }

            h2 {
                font-size: 21px;
            }

            p {
                font-size: 16px;
            }
        }

    </style>

</head>

<body>

    <main class="container">

        <h1>ANIMACIÓN SENOIDAL</h1>
        
        <div class="linea"></div>

        <h2>¡Bienvenido a mi página 7!</h2>

        <p>
            Animación utilizando las funciones seno y coseno.
        </p>


        <div class="canvas-container">

            <canvas
                id="canvas"
                width="1000"
                height="700">
            </canvas>

        </div>

        <p>
            La imagen se mueve y cambia de tamaño
            automáticamente.
        </p>

        <a class="back-button"
           href="../index.html">
            ← Regresar al menú
        </a>

    </main>


    <script>

        window.onload = function () {

            var canvas =
                document.getElementById("canvas");
            var context =
                canvas.getContext("2d");
            var imagen = new Image();
            imagen.src = "gato.jpg";
            var tiempo = 0;
            var centroX = canvas.width / 2;
            var centroY = canvas.height / 2;
            var ancho = 200;
            var alto = 200;

            function drawFrame() {
                window.requestAnimationFrame(drawFrame);
                context.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                var posicionY =
                    centroY + Math.sin(tiempo) * 120;
                var escala =
                    1 + Math.cos(tiempo) * 0.3;
                context.save();
                context.translate(
                    centroX,
                    posicionY
                );

                context.scale(
                    escala,
                    escala
                );

                if (imagen.complete &&
                    imagen.naturalWidth > 0) {
                    context.drawImage(
                        imagen,
                        -ancho / 2,
                        -alto / 2,
                        ancho,
                        alto
                    );
                } else {
                    context.fillStyle = "#a70d81";
                    context.beginPath();
                    context.arc(
                        0,
                        0,
                        90,
                        0,
                        Math.PI * 2
                    );
                    context.fill();
                }

                context.restore();

                tiempo += 0.02;

            }
            drawFrame();

        };

    </script>

</body>
</html>
