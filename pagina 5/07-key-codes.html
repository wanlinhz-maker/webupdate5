<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Key Codes</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Personajes</h1>
    <canvas id="canvas" width="1000" height="800"></canvas>
    <aside>Presiona A, E, I, O o U para cambiar de personaje.</aside>
    <script src="keycodes.js"></script>
    
    <script>
    window.onload = function () {
        var canvas = document.getElementById("canvas");
        var context = canvas.getContext("2d");

        // Tamaño de la imagen
        var ancho = 300;
        var alto = 600;

        // Posición de la imagen
        var x = (canvas.width - ancho) / 2;
        var y = 150;

        // Imágenes de los personajes
        var luye = new Image();
        luye.src = "Luye.jpg";

        var wuxian = new Image();
        wuxian.src = "Wuxian.jpg";

        var xiaohei = new Image();
        xiaohei.src = "LuoXiaohei.jpg";

        var ximuzi = new Image();
        ximuzi.src = "Ximuzi.jpg";

        var chinian = new Image();
        chinian.src = "Chinian.jpg";


    // Función para mostrar el personaje
    function mostrarPersonaje(nombre, imagen) {
        context.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        // Nombre del personaje
        context.font = "40px Gill Sans";
        context.fillStyle = "rgb(167, 13, 129)";
        context.textAlign = "center";
        context.fillText(
            nombre,
            canvas.width / 2,
            100
        );

        // Imagen
        context.drawImage(
            imagen,
            x,
            y,
            ancho,
            alto
        );

        // Descripción
        context.font = "18px Verdana";
        context.fillStyle = "#191b38";
        context.textAlign = "center";

        context.fillText(
            descripcion,
            canvas.width / 2,
            y + alto + 50
        );
    }

      function onKeyboardEvent (event) {
        switch (event.keyCode) {
        case keycode.UP:
          console.log("up!");
          context.clearRect(0, 0, innerWidth, innerHeight);
          y-=5;
          context.fillRect(x,y,100,100);
          break;
        case keycode.DOWN:
          console.log("down!");
          context.clearRect(0, 0, innerWidth, innerHeight);
          y+=5;
          context.fillRect(x,y,100,100);
          break;
        case keycode.LEFT:
          console.log("left!");
          context.clearRect(0, 0, innerWidth, innerHeight);
          x-=5;
          context.fillRect(x,y,100,100);
          break;
        case keycode.RIGHT:
          console.log("right!");
          context.clearRect(0, 0, innerWidth, innerHeight);
          x+=5;
          context.fillRect(x,y,100,100);
          break;
        case keycode.SPACE:
          console.log("Jump!");
          break;

        case keycode.A:
            console.log("Letra A");
            mostrarPersonaje(
            "Luye",
            luye);
            break;
        
        case keycode.E:
            console.log("Letra E");
            mostrarPersonaje(
            "Wuxian",
            wuxian);
            break;

        case keycode.I:
            console.log("Letra I");
            mostrarPersonaje(
            "Xiaohei",
            xiaohei);
            break;

        case keycode.O:
            console.log("Letra O");
            mostrarPersonaje(
            "Chinian",
            chinian);
            break;

        case keycode.U:
            console.log("Letra U");
            mostrarPersonaje(
            "Ximuzi",
            ximuzi);
            break;

            
        default:
            console.log(event.keyCode);
        }
      }

      window.addEventListener('keydown', onKeyboardEvent, false);
    };
    </script>
    <li>
            <a href="../index.html">Regresar al menú</a>
      </li>
  </body>
</html>
