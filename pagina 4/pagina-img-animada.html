<!doctype html>
<html>
 <head>
   <meta charset="utf-8">
   <title>Pagina imagen animada</title>

   <style>
    body{
        text-align: center;
    }

    canvas{
        border: 2px solid #5e5e5e;
        background-color: rgb(0, 0, 0);
    }
    h1 {
            color: rgb(167, 13, 129);
            text-align: center;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, sans-serif;
        }
   </style>

   <script>

        
        var x = 100;
        var y = 100;

        
        var dx = 2;
        var dy = 2;

        
        var ancho = 150;
        var alto = 150;

       
        var imagen = new Image();
        imagen.src = "XiaoHei.jpg";


        function animate(){

            requestAnimationFrame(animate);

            var canvas = document.getElementById("micanvas");
            var context = canvas.getContext("2d");

            
            context.clearRect(0, 0, canvas.width, canvas.height);

           
            context.drawImage(imagen, x, y, ancho, alto);


           
            if (x + ancho >= canvas.width || x <= 0){
                dx = -dx;
            }

            
            if (y + alto >= canvas.height || y <= 0){
                dy = -dy;
            }


           
            x += dx;
            y += dy;
        }

        animate();

   </script>

 </head>

 <body>
    <h1>MI IMAGEN ANIMADA</h1>
    <canvas id="micanvas" width="800" height="600"></canvas>
     <li>
            <a href="../index.html">Regresar al menú</a>
        </li>

 </body>
</html>
