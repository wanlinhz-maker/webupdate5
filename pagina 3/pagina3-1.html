<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pagina 3</title>

  <style>
    canvas {
      border: 3px solid brown;
      background-color: white;
    }
    h1 {
            color: rgb(167, 13, 129);
            text-align: center;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, sans-serif;
        }
    body {
        background-color:rgb(255, 255, 255);
        text-align: center;
    }
  </style>
</head>

<body>
    <h1>MI ARTE</h1>


  <canvas id="micanvas" width="800" height="600"></canvas>

  <script>
    var canvas = document.getElementById("micanvas");
    var ctx = canvas.getContext("2d");

    var x = 100;

    function dibujar() {

      // Cielo
      ctx.fillStyle = "skyblue";
      ctx.fillRect(0, 0, 800, 400);

      // Pasto
      ctx.fillStyle = "green";
      ctx.fillRect(0, 400, 800, 200);

      // Sol
      ctx.fillStyle = "yellow";
      ctx.fillRect(x, 80, 80, 80);
      ctx.fillRect(x - 20, 100, 20, 40);
      ctx.fillRect(x + 80, 100, 20, 40);
      ctx.fillRect(x + 20, 60, 40, 20);
      ctx.fillRect(x + 20, 160, 40, 20);

      // Casa
      ctx.fillStyle = "brown";
      ctx.fillRect(300, 280, 250, 180);

      // Techo
      ctx.fillStyle = "darkred";
      ctx.fillRect(280, 250, 290, 30);

      // Puerta
      ctx.fillStyle = "darkblue";
      ctx.fillRect(390, 350, 60, 110);

      // Ventanas
      ctx.fillStyle = "lightblue";
      ctx.fillRect(330, 320, 40, 40);
      ctx.fillRect(480, 320, 40, 40);

      // Árbol
      ctx.fillStyle = "brown";
      ctx.fillRect(150, 350, 50, 150);

      ctx.fillStyle = "darkgreen";
      ctx.fillRect(100, 280, 150, 70);
      ctx.fillRect(120, 250, 110, 30);
      ctx.fillRect(140, 220, 70, 30);

      // Movimiento del sol
      x = x + 1;

      if (x > 700) {
        x = -100;
      }

      requestAnimationFrame(dibujar);
    }

    dibujar();

  </script>

        <li>
            <a href="../index.html">Regresar al menú</a>
        </li>

</body>
</html>
