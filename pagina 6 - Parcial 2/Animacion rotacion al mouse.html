<!doctype html>
<html lang="es">

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ROTAR EL RATÓN</title>

    <link rel="stylesheet" href="style.css">

    <style>

        

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;

            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #ead5df,
                #d4bac6,
                #c7a7bc
            );

            font-family:
                'Gill Sans',
                'Gill Sans MT',
                Calibri,
                sans-serif;

            color: #460c38;
        }


 

        .container {
            width: 100%;
            max-width: 1100px;

            margin: 0 auto;

            padding: 40px;

            background-color: rgba(255, 255, 255, 0.90);

            border-radius: 30px;

            box-shadow:
                0 15px 40px rgba(70, 12, 56, 0.20);

            text-align: center;
        }


    

        h1 {
            margin: 0;

            color: rgb(167, 13, 129);

            font-size: 40px;

            letter-spacing: 2px;
        }


       

        .linea {
            width: 70px;
            height: 5px;

            margin: 18px auto 25px;

            background-color: rgb(167, 13, 129);

            border-radius: 10px;
        }



        p {
            margin: 25px 0;

            color: rgb(167, 13, 129);

            font-family:
                'Franklin Gothic Medium',
                'Arial Narrow',
                Arial,
                sans-serif;

            font-size: 18px;
        }



        .canvas-container {
            width: 100%;

            padding: 12px;

            background-color: #f7edf3;

            border: 2px solid #d7b4ca;

            border-radius: 20px;

            box-shadow:
                0 10px 25px rgba(70, 12, 56, 0.18);

            overflow: hidden;
        }


        canvas {
            display: block;

            width: 100%;

            height: auto;

            background-color: white;

            border-radius: 12px;
        }


     

        .back-button {
            display: inline-block;

            margin-top: 30px;

            padding: 13px 28px;

            background-color: rgb(167, 13, 129);

            color: white;

            text-decoration: none;

            border-radius: 30px;

            font-size: 16px;

            font-weight: bold;

            transition:
                background-color 0.3s ease,
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }


        .back-button:hover {
            background-color: #7d0961;

            transform: translateY(-3px);

            box-shadow:
                0 8px 18px rgba(167, 13, 129, 0.30);
        }


      

        @media (max-width: 700px) {

            body {
                padding: 20px 12px;
            }

            .container {
                padding: 25px 15px;

                border-radius: 20px;
            }

            h1 {
                font-size: 30px;
            }

            p {
                font-size: 16px;
            }

            .canvas-container {
                padding: 8px;
            }

        }

    </style>

</head>


<body>

    <main class="container">

        <h1>ROTAR EL RATÓN</h1>

        <div class="linea"></div>


       

        <div class="canvas-container">

            <canvas
                id="canvas"
                width="1000"
                height="700">
            </canvas>

        </div>


       
        <p>
            Mueve el ratón sobre el elemento canvas.
        </p>


     

        <a
            class="back-button"
            href="../index.html">
            Regresar al menú
        </a>

    </main>


    <script src="utils.js"></script>



    <script>

        window.onload = function () {

            var canvas = document.getElementById('canvas'),
                context = canvas.getContext('2d'),
                mouse = utils.captureMouse(canvas),
                pelota = new Image();

            pelota.src = 'pelota.jpg';


            (function drawFrame () {

                window.requestAnimationFrame(
                    drawFrame,
                    canvas
                );

                context.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                context.save();


                var x = canvas.width / 2,
                    y = canvas.height / 2;


                context.translate(x, y);


                var dx = mouse.x - x,
                    dy = mouse.y - y;


                var radianes =
                    Math.atan2(dy, dx);


                console.log(radianes);


                context.rotate(radianes);


                context.drawImage(
                    pelota,
                    -100,
                    -100,
                    200,
                    200
                );


                context.restore();

            }());

        };

    </script>

</body>

</html>
