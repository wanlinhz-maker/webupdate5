    <meta charset="utf-8">
    <title>Rotate to Mouse</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
     <h1>Rotate to Mouse</h1>

    <canvas id="canvas" width="1000" height="700"></canvas>

    <p>Move mouse on canvas element.</p>
    
    <script src="utils.js"></script>
    <!--<script src="./classes/arrow.js"></script>-->
    <script>
    window.onload = function () {
      var canvas = document.getElementById('canvas'),
          context = canvas.getContext('2d'),
          mouse = utils.captureMouse(canvas),
          pelota = new Image();
          pelota.src = 'pelota.jpg';
        
      (function drawFrame () {
        window.requestAnimationFrame(drawFrame, canvas);
        context.clearRect(0, 0, canvas.width, canvas.height);
        context.save();
        var x = canvas.width / 2,
            y = canvas.height / 2;

        context.translate(x, y);
        var dx = mouse.x - x,
            dy = mouse.y - y;
        
        var radianes = Math.atan2(dy, dx); //radians
        console.log(radianes);
        context.rotate(radianes); //radians
        context.drawImage(pelota, -100, -100, 200, 200);
        context.restore();
        
      }());
    };
    </script>
     <ol>
        <li>
            <a href="../index.html">Regresar al menú</a>
        </li>
    </ol>
  </body>
